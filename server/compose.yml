# Two containers, and the split is not tidiness: it makes the write kill switch a
# `docker compose stop ingest`, which leaves every read path working. A deposit
# endpoint that is being flooded can be switched off without breaking one reader.

services:
  web:
    image: nginx:alpine
    ports: ["8080:80"]
    volumes:
      - ./nginx.conf:/etc/nginx/conf.d/default.conf:ro
      - data:/data:ro
    restart: unless-stopped

  ingest:
    build:
      context: ..
      dockerfile: server/Dockerfile
    volumes:
      - data:/data
    environment:
      COLOPHON_MAX_BODY: "26214400"
      COLOPHON_RATE_PER_DAY: "20"
      COLOPHON_GLOBAL_PER_HOUR: "60"
    ports: ["8000:8000"]
    restart: unless-stopped

volumes:
  data:
