# The read path. Static files, nothing else — no application, nothing to exhaust
# but bandwidth, and nothing here depends on the write container being alive.

server {
    listen 80;
    server_name _;
    root /data/public;

    # Byte-identity is a serving problem, not a storage problem. Compress a register
    # on the way out and its digest changes; the signature then fails for a reader
    # who did everything right.
    gzip off;
    gzip_static off;
    etag on;

    # Everything that is not one of these four is served as octet-stream, so a
    # browser saves the bytes instead of interpreting them. events.jsonl, .sig, .tsr,
    # .ots, .json and .txt all land here deliberately.
    default_type application/octet-stream;
    types {
        text/html              html htm;
        image/svg+xml          svg;
        text/css               css;
        application/javascript js;
    }

    # A case never changes: its address is derived from its own root.
    location /c/ {
        add_header Cache-Control "public, max-age=31536000, immutable";
        try_files $uri $uri/index.html =404;
    }

    # .well-known must be servable. Most static-server defaults block dot-paths, and
    # GitHub Pages needs .nojekyll for the same reason.
    location ~ /\.well-known/ { allow all; }
    location ~ /\.(?!well-known) { deny all; }

    location = /health { return 200 "ok\n"; }
    location / { try_files $uri $uri/index.html =404; }

    autoindex off;                 # no listing: an index is what opaque addresses prevent
    server_tokens off;
}
