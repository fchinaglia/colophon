<!DOCTYPE html><html><head><meta charset="utf-8"><link rel=stylesheet href=base.css>
<style>body{width:1600px;height:740px;padding:56px 72px;display:flex;flex-direction:column}
h2{font-size:38px;font-weight:700;letter-spacing:-.01em;margin:14px 0 10px}
.cap{max-width:1180px;font-size:19px;margin-bottom:22px}
.sys{font-family:ui-sans-serif,sans-serif;font-size:17px;fill:#16171a;font-weight:600;text-anchor:middle}
.ttl{font-family:ui-sans-serif,sans-serif;font-size:22px;font-weight:700}
.note{font-family:ui-sans-serif,sans-serif;font-size:16px;fill:#5a5c62}
</style></head><body>
<div class="kick">la distinzione che tiene insieme tutto</div>
<h2>L'AI nel percorso di costruzione, non nel percorso di esecuzione.</h2>
<div class="cap">È la stessa tecnologia. Cambia se la compri come investimento o la affitti come servizio.</div>
<svg width="1456" height="560" viewBox="0 0 1456 560">
  <defs><marker id="ar" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto">
    <path d="M0 0 L10 5 L0 10 z" fill="#8a8c92"/></marker>
    <marker id="arb" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto">
    <path d="M0 0 L10 5 L0 10 z" fill="#2a78d6"/></marker></defs>

  <!-- ESECUZIONE -->
  <text class="ttl" x="0" y="24" fill="#e34948">Percorso di esecuzione</text>
  <g transform="translate(0,56)">
    <rect x="0" y="18" width="180" height="56" rx="8" fill="#fff" stroke="#c9cbd0" stroke-width="2"/>
    <text class="sys" x="90" y="52">transazione</text>
    <line x1="188" y1="46" x2="252" y2="46" stroke="#8a8c92" stroke-width="2" marker-end="url(#ar)"/>
    <rect x="262" y="18" width="150" height="56" rx="8" fill="#f8dfde" stroke="#e34948" stroke-width="2.5"/>
    <text class="sys" x="337" y="52" fill="#16171a">modello</text>
    <line x1="420" y1="46" x2="484" y2="46" stroke="#8a8c92" stroke-width="2" marker-end="url(#ar)"/>
    <rect x="494" y="18" width="180" height="56" rx="8" fill="#fff" stroke="#c9cbd0" stroke-width="2"/>
    <text class="sys" x="584" y="52">risposta</text>
    <text class="note" x="700" y="42">a ogni transazione, per sempre</text>
    <text class="note" x="700" y="68" fill="#e34948" font-weight="600">canone · errore in produzione · output probabilistico</text>
    <g opacity=".38">
      <rect x="0" y="90" width="180" height="10" rx="5" fill="#c9cbd0"/>
      <rect x="262" y="90" width="150" height="10" rx="5" fill="#e34948"/>
      <rect x="494" y="90" width="180" height="10" rx="5" fill="#c9cbd0"/>
      <rect x="0" y="108" width="180" height="10" rx="5" fill="#c9cbd0"/>
      <rect x="262" y="108" width="150" height="10" rx="5" fill="#e34948"/>
      <rect x="494" y="108" width="180" height="10" rx="5" fill="#c9cbd0"/>
    </g>
  </g>

  <line x1="0" y1="250" x2="1456" y2="250" stroke="#e2e0da" stroke-width="2"/>

  <!-- COSTRUZIONE -->
  <text class="ttl" x="0" y="306" fill="#2a78d6">Percorso di costruzione</text>
  <g transform="translate(0,338)">
    <rect x="0" y="18" width="180" height="56" rx="8" fill="#fff" stroke="#c9cbd0" stroke-width="2"/>
    <text class="sys" x="90" y="52">specifica</text>
    <line x1="188" y1="46" x2="252" y2="46" stroke="#2a78d6" stroke-width="2" marker-end="url(#arb)"/>
    <rect x="262" y="18" width="150" height="56" rx="8" fill="#dae7f5" stroke="#2a78d6" stroke-width="2.5"/>
    <text class="sys" x="337" y="52" fill="#16171a">modello</text>
    <line x1="420" y1="46" x2="484" y2="46" stroke="#2a78d6" stroke-width="2" marker-end="url(#arb)"/>
    <rect x="494" y="18" width="290" height="56" rx="8" fill="#fff" stroke="#2a78d6" stroke-width="2"/>
    <text class="sys" x="639" y="52">codice · schemi · migrazioni</text>
    <text class="note" x="812" y="42">una volta sola</text>
    <text class="note" x="812" y="68" fill="#2a78d6" font-weight="600">costo una tantum · errore in revisione · output deterministico</text>

    <line x1="639" y1="84" x2="639" y2="128" stroke="#8a8c92" stroke-width="2" marker-end="url(#ar)"/>
    <rect x="494" y="138" width="290" height="52" rx="8" fill="#fff" stroke="#c9cbd0" stroke-width="2"/>
    <text class="sys" x="639" y="170">le transazioni passano di qui</text>
    <text class="note" x="812" y="170">senza che il modello sia nel percorso</text>
  </g>
</svg>
</body></html>
