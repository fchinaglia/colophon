# deposit.colophonmethod.com — the instance, frozen.
#
# FROZEN, 24 August 2026. The write path is closed and the ingest container is stopped:
# Colophon delivers a case as a bundle the author packs and hands over, and an instance
# is no longer part of the method. What is already here keeps being served, forever, and
# that is not sentiment — a case deposited here has its address printed in a signed
# technical line inside a published PDF, which cannot be edited. Taking this host down
# would turn that line into a dead link under a disclosure, which disclosures.md calls
# evidence from a distance and the opposite of it up close.
#
# So: reads unchanged, writes gone. Do not delete the data directory.
#
# This file outlives server/ and the rest of deploy/. It is infrastructure now, like the
# key at the apex, not a component of the project.
#
# A different host from the apex on purpose: the key that vouches for a depositor must
# not be served by the same machine that stores their case. The apex serves
# /.well-known/colophon/keys; this name serves cases and nothing else.

# ── rate limiting ────────────────────────────────────────────────────────────
# These sit outside every server block on purpose. sites-enabled/*.conf is included
# inside http{}, so the top of this file is already the right context — it looks wrong
# and is not.
#
# One zone now. The write zone is gone with the write path: there is nothing left that
# unpacks a tar, checks a signature or recomputes a chain, so the only cost left to
# limit is serving a static file.
#
# Counting is not logging. These keep a counter in shared memory with a short window;
# nothing reaches disk and nothing is aggregated. That is what lets the instance keep
# `access_log off` — a disclosure tool that tracks its readers is self-refuting — and
# still defend itself.
#
# If a CDN is ever put in front, $binary_remote_addr becomes the CDN's address and the
# limit applies to everyone at once. Configure real_ip, or move the limit to the edge.
limit_req_zone  $binary_remote_addr zone=reads:10m  rate=30r/s;
limit_conn_zone $binary_remote_addr zone=conns:10m;
limit_req_status  429;
limit_conn_status 429;

server {
    listen 80;
    listen [::]:80;
    server_name deposit.colophonmethod.com;
    location /.well-known/acme-challenge/ { root /var/www/certbot; }
    location / { return 301 https://deposit.colophonmethod.com$request_uri; }
}

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name deposit.colophonmethod.com;
    root /srv/deposit/public;

    ssl_certificate     /etc/letsencrypt/live/deposit.colophonmethod.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/deposit.colophonmethod.com/privkey.pem;

    # A disclosure tool that logs its readers is self-refuting.
    access_log off;
    server_tokens off;

    # A slow upload holds a connection without spending request quota, so the rate
    # limits above do not see it. This is what does.
    limit_conn conns 16;
    client_header_timeout 20s;
    autoindex off;                  # no listing: an index is what opaque addresses prevent

    # Byte-identity is a serving problem. Compress a register on the way out and its
    # digest changes; the signature then fails for a reader who did everything right.
    gzip off;
    gzip_static off;

    default_type application/octet-stream;
    types {
        text/html              html htm;
        image/svg+xml          svg;
        text/css               css;
        application/javascript js;
    }

    # The write path, closed. 410 and not 404: the difference is the whole message —
    # this endpoint existed, it is gone deliberately, and nothing is broken. A 404 would
    # read as a misconfiguration and invite a retry.
    #
    # The body is plain text because a command-line client is what arrives here, and it
    # names the replacement rather than only refusing: a refusal that does not say what
    # to do instead is where someone concludes the method needs an instance.
    location = /c {
        default_type text/plain;
        charset utf-8;              # the body has an em dash in it; say so
        add_header Cache-Control "no-store" always;
        return 410 "This instance no longer accepts deposits.\n\nColophon does not need one. A case travels as a bundle you pack yourself:\n\n    python3 build_bundle.py\n\nIt writes colophon-<case_uid>.tar — the register, the seal, the measurement,\nand verify.html. A reader drops it on the verifier with the network off.\n\nPublish your key once, at a domain you control or at\nhttps://api.github.com/users/<you>/ssh_signing_keys, and nothing else is needed.\n\nCases already deposited here are still served, at the same addresses, and will\nstay that way.\n";
    }

    # A case never changes: its address is derived from its own uid.
    location /c/ {
        # A reader opening one case fetches the page, its icon and often the bundle.
        # The burst absorbs that; the rate stops someone walking the whole instance.
        limit_req zone=reads burst=60 nodelay;
        add_header Cache-Control "public, max-age=31536000, immutable";
        # verification.html as the last fallback: `build_page.py` writes the page as
        # index.html now, so a case sealed today answers at the folder on its own. The
        # fallback carries the cases sealed before it did, whose manifests cover the old
        # name -- without it a sound, sealed, correctly deposited case answers 404 at
        # the very address its own note prints, which is the failure shape
        # disclosures.md calls the opposite of evidence.
        try_files $uri $uri/index.html $uri/verification.html =404;
    }

    location = /health { return 200 "ok\n"; }

    # A wrong address answers 404, never 200 with something else: a mistyped URL under a
    # disclosure that looks like it worked is worse than one that plainly did not.
    location / { try_files $uri $uri/index.html =404; }

    location ~ /\.(?!well-known) { deny all; }
}
