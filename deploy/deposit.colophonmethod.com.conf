# deposit.colophonmethod.com — the instance.
#
# A different host from the apex on purpose: the key that vouches for a depositor must
# not be served by the same machine that stores their case. The apex serves
# /.well-known/colophon/keys; this name serves cases and nothing else.

# ── rate limiting ────────────────────────────────────────────────────────────
# These sit outside every server block on purpose. sites-enabled/*.conf is included
# inside http{}, so the top of this file is already the right context — it looks wrong
# and is not.
#
# Two zones, because the two paths cost different amounts: a POST unpacks a tar, checks
# a signature and recomputes a chain, while a GET serves a static file. One threshold
# for both would either throttle readers or leave the deposit open.
#
# Counting is not logging. These keep a counter in shared memory with a short window;
# nothing reaches disk and nothing is aggregated. That is what lets the instance keep
# `access_log off` — a disclosure tool that tracks its readers is self-refuting — and
# still defend itself.
#
# If a CDN is ever put in front, $binary_remote_addr becomes the CDN's address and the
# limit applies to everyone at once. Configure real_ip, or move the limit to the edge.
limit_req_zone  $binary_remote_addr zone=reads:10m  rate=30r/s;
limit_req_zone  $binary_remote_addr zone=writes:1m  rate=6r/m;
limit_conn_zone $binary_remote_addr zone=conns:10m;
limit_req_status  429;
limit_conn_status 429;

server {
    listen 80;
    listen [::]:80;
    server_name deposit.colophonmethod.com;
    location /.well-known/acme-challenge/ { root /var/www/certbot; }
    location / { return 301 https://deposit.colophonmethod.com$request_uri; }
}

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name deposit.colophonmethod.com;
    root /srv/deposit/public;

    ssl_certificate     /etc/letsencrypt/live/deposit.colophonmethod.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/deposit.colophonmethod.com/privkey.pem;

    # A disclosure tool that logs its readers is self-refuting.
    access_log off;
    server_tokens off;

    # A slow upload holds a connection without spending request quota, so the rate
    # limits above do not see it. This is what does.
    limit_conn conns 16;
    client_header_timeout 20s;
    autoindex off;                  # no listing: an index is what opaque addresses prevent

    # Byte-identity is a serving problem. Compress a register on the way out and its
    # digest changes; the signature then fails for a reader who did everything right.
    gzip off;
    gzip_static off;

    default_type application/octet-stream;
    types {
        text/html              html htm;
        image/svg+xml          svg;
        text/css               css;
        application/javascript js;
    }

    # The write path. Everything protecting it that does not need to know about
    # signatures lives here: the size cap, the rate, the timeouts.
    location = /c {
        limit_except POST { deny all; }
        # burst is where this is got wrong: without it nginx refuses the second request
        # that arrives in the same instant. Three is a retry, not a flood.
        limit_req zone=writes burst=3 nodelay;
        client_max_body_size 25m;
        client_body_timeout 120s;
        proxy_pass http://127.0.0.1:8000/c;
        proxy_read_timeout 180s;
        proxy_request_buffering on;   # do not stream an unauthenticated body to ingest
    }

    # A case never changes: its address is derived from its own uid.
    location /c/ {
        # A reader opening one case fetches the page, its icon and often the bundle.
        # The burst absorbs that; the rate stops someone walking the whole instance.
        limit_req zone=reads burst=60 nodelay;
        add_header Cache-Control "public, max-age=31536000, immutable";
        # verification.html as the last fallback: the address a case declares is the
        # folder, and `build_page.py` writes the page under that name rather than as an
        # index. Without this a sound, sealed, correctly deposited case answers 404 at
        # the very address its own note prints -- which is the failure shape
        # disclosures.md calls the opposite of evidence.
        try_files $uri $uri/index.html $uri/verification.html =404;
    }

    location = /health { return 200 "ok\n"; }

    # A wrong address answers 404, never 200 with something else: a mistyped URL under a
    # disclosure that looks like it worked is worse than one that plainly did not.
    location / { try_files $uri $uri/index.html =404; }

    location ~ /\.(?!well-known) { deny all; }
}
