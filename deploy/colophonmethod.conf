# colophonmethod.com — the site, and the key that anchors an identity.
#
# The apex is canonical. www redirects to it permanently, because the address is
# printed into notes and frozen into PDFs, and two addresses for one thing means half
# of them eventually rot.
#
# The instance, when it exists, belongs on its own host — deposit.colophonmethod.com.
# That is not tidiness: it keeps the key and the evidence on different servers, so a
# depositor's key is not vouched for by the same machine that stores their case.

server {
    listen 80;
    listen [::]:80;
    server_name colophonmethod.com www.colophonmethod.com;

    # Certbot writes its challenge here; everything else goes to TLS.
    location /.well-known/acme-challenge/ { root /var/www/certbot; }
    location / { return 301 https://colophonmethod.com$request_uri; }
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name www.colophonmethod.com;

    ssl_certificate     /etc/letsencrypt/live/colophonmethod.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/colophonmethod.com/privkey.pem;

    return 301 https://colophonmethod.com$request_uri;
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name colophonmethod.com;
    root /srv/colophon;

    ssl_certificate     /etc/letsencrypt/live/colophonmethod.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/colophonmethod.com/privkey.pem;

    # The whole strength of the key anchor is this certificate: it is what lets a
    # reader say "whoever controlled this domain published this key". A renewal that
    # fails does not break the site loudly — it weakens the anchor quietly. Watch it.

    # A disclosure tool that logs its readers is self-refuting.
    access_log off;

    # Same rule as the instance: never re-encode what a digest was taken over.
    gzip off;
    gzip_static off;

    charset utf-8;
    server_tokens off;
    autoindex off;

    # The keys file is meant to be fed straight to ssh-keygen. Serve it as text so a
    # browser shows it and `curl -O` keeps it byte for byte.
    location = /.well-known/colophon/keys {
        default_type text/plain;
        add_header Cache-Control "public, max-age=300";
    }
    location /.well-known/ { allow all; }
    location ~ /\.(?!well-known) { deny all; }

    location / { try_files $uri $uri/ /index.html =404; }
}
