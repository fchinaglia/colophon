# Step one only. HTTP, no TLS, just enough for certbot to prove the domain.
#
# The full config names certificate files that do not exist yet, and nginx refuses to
# start when a certificate is missing — so it cannot be the config you install first.
# Put this one up, get the certificate, then swap.

server {
    listen 80;
    listen [::]:80;
    server_name colophonmethod.com www.colophonmethod.com;
    root /srv/colophon;

    access_log off;
    server_tokens off;
    autoindex off;

    location /.well-known/acme-challenge/ { root /var/www/certbot; }
    location = /.well-known/colophon/keys { default_type text/plain; }
    location / { try_files $uri $uri/ =404; }
}
